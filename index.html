<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>myHealth</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0f172a">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="myHealth">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="topbar">
  <h1>myHealth</h1>
</header>

<main id="view-root"></main>

<nav class="tabbar">
  <button data-action="switch-view" data-view="schedule" class="tab active">
    <span class="tab-label">Schedule</span>
  </button>
  <button data-action="switch-view" data-view="today" class="tab">
    <span class="tab-label">Today</span>
  </button>
  <button data-action="switch-view" data-view="library" class="tab">
    <span class="tab-label">Library</span>
  </button>
  <button data-action="switch-view" data-view="summary" class="tab">
    <span class="tab-label">Summary</span>
  </button>
  <button data-action="switch-view" data-view="settings" class="tab">
    <span class="tab-label">Settings</span>
  </button>
</nav>

<script type="module" src="js/muscle-map.js"></script>
<script defer src="js/store.js"></script>
<script defer src="js/app.js"></script>
</body>
</html>
